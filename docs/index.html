<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北海道の公共測量 — Open MCT</title>
    <!-- Open MCT 4.3.1 (unpkg)。tabularmaps/do と同じ版に固定する。 -->
    <link rel="stylesheet" href="https://unpkg.com/openmct@4.3.1/dist/espressoTheme.css" />
    <link rel="stylesheet" href="./vendor/do/style.css" />
    <link rel="stylesheet" href="./survey.css" />
  </head>
  <body class="tm-dark">
    <script>
      // CDN 経由では検索インデクサの SharedWorker がクロスオリジンでブロックされるため、
      // 同期フォールバックに倒す (dwg7/cafebabe patterns/open-mct-operations.md)。
      window.SharedWorker = undefined;
    </script>
    <script src="https://unpkg.com/openmct@4.3.1/dist/openmct.js"></script>
    <div id="app"></div>
    <script src="./vendor/do/tabularmap.js"></script>
    <script src="./survey-plugin.js"></script>
    <script>
      (function () {
        const script = document.querySelector('script[src*="openmct.js"]');
        if (script) openmct.setAssetPath(script.src.replace(/openmct\.js(?:\?.*)?$/, ''));
        openmct.install(openmct.plugins.LocalStorage());
        openmct.install(openmct.plugins.UTCTimeSystem());
        openmct.install(openmct.plugins.Espresso());
        openmct.install(DoSurveyPlugin({ dataUrl: './data/', doDataUrl: './vendor/do/data/' }));
        openmct.start('#app');
      })();
    </script>
  </body>
</html>
